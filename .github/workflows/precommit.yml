name: poe precommit

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  precommit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.12', '3.13', '3.14' ]
    # One conformance run id per job, shared by every step below
    # (#lzstalemanifest). The steps are separate processes, so the id cannot be
    # generated inside one of them and still mean anything to the others — it has
    # to be job-scoped, which is what `make check` gets from a `:=` variable and
    # `poe precommit` gets from its `uses`.
    #
    # The "Test" step stamps it as line 1 of build/conformance-fixtures-loaded.txt
    # and the coverage-guard step refuses a manifest carrying any other id. That
    # matters here even though the runner starts clean: the ORDER of these steps
    # is the only thing that used to make the guard's "these bytes were really
    # read" true, and nothing checked it. Move the guard above the test step, or
    # let the test step fail while the guard still runs, and the claim silently
    # becomes about whatever wrote that file last.
    #
    # `run_attempt` is in the value because a re-run of a failed job keeps the
    # same `run_id`, and the whole point is a value no other invocation shares.
    env:
      LAZILY_CONFORMANCE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      # lazily-spec is the canonical cross-language conformance source. Clone it
      # as a sibling BEFORE any test step so every conformance suite that reads
      # ../lazily-spec has the canonical fixtures, and CI fails on drift rather
      # than skipping (#lzspecconf).
      - name: Fetch canonical lazily-spec conformance fixtures (#lzspecconf)
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      # The conformance suites skip when the sibling is absent, which is correct
      # for a local checkout and fatal in CI: without these guards a green run
      # would mean "tested nothing". Add a guard here for every fixture
      # directory a suite reads.
      - name: Assert canonical lazily-spec fixtures are present (#lzspecconf)
        run: |
          test -d ../lazily-spec/conformance || { echo "::error::../lazily-spec/conformance missing — the conformance suites would silently skip"; exit 1; }
          test -d ../lazily-spec/conformance/familysync || { echo "::error::../lazily-spec/conformance/familysync missing — test_family_sync.py would silently fall back to local fixtures"; exit 1; }
          test -d ../lazily-spec/conformance/reactive-graph || { echo "::error::../lazily-spec/conformance/reactive-graph missing — test_reactive_graph_conformance.py would silently skip every context"; exit 1; }
          test -f ../lazily-spec/conformance/reactive-graph/transitive_invalidation_reaches_depth.json || { echo "::error::transitive_invalidation_reaches_depth.json missing — it is the only reactive-graph fixture lazily-py can replay today, so without it the runner executes nothing"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      # The steps below are `poe precommit` unrolled, one step per gate that
      # `make check` runs, in the same order (#lzcheckcireachguard). Same work,
      # same commands, no aggregate wrapper.
      #
      # `poe precommit` as a single step was correct about WHAT had to run and
      # opaque about WHETHER it did. Two of `make check`'s gates — `ruff format`
      # and a non-fixing `ruff check` — were not in that list at all, and nothing
      # in this file said so: the step name still read "Run poe precommit" and
      # still went green. That is the same failure as #lzguardsnotinci and
      # #lzinteroppeerci one level up, and it is why check-ci-reach.sh compares
      # this workflow's run: bodies against the Makefile closure instead of
      # trusting a name.
      #
      # All four conformance guards still run, now visibly:
      #   rung 1  runtime fixture manifest / coverage   poe conformance_coverage
      #   rung 2  unconsumed assertion key              pytest_sessionfinish
      #   rung 3  read-but-unasserted assertion key     pytest_sessionfinish
      #   rung 4  unreplayed fixture scenario           pytest_sessionfinish
      # Rungs 2-4 live inside the test binary, so the `poe test` step carries
      # them. Add any new gate to `make check` AND here, or the reachability
      # guard at the bottom of this job fails the run.

      # `make format` REWRITES; in CI that would pass unconditionally and prove
      # nothing, so run the same formatter in --check mode. Same anchor, honest
      # verdict.
      - name: Format (make format)
        run: uv run ruff format --check src/lazily/ tests/

      # --no-fix for the same reason: pyproject sets `[tool.ruff] fix = true`, so
      # a bare `ruff check` in CI would silently repair the tree it is supposed
      # to be judging and exit 0.
      - name: Lint (make lint)
        run: uv run ruff check --no-fix src/lazily/ tests/

      - name: Type check (make type-check)
        run: uv run poe ty

      # Not part of `make check`, but part of the old `poe precommit` list —
      # keep it running rather than losing it in the unroll.
      - name: README examples
        run: uv run poe run_readme

      # Truncate the fixture manifest before the suite appends to it. A manifest
      # left over from an earlier step would credit this run with fixtures it
      # never opened, which is the one file rung 1 treats as evidence.
      - name: Test (make test)
        run: |
          uv run poe conformance_manifest
          uv run poe test

      - name: Conformance coverage guard (make conformance-coverage)
        run: uv run poe conformance_coverage

      # The cross-binding wire-compatibility peer (#lzinteroppeerci). Nine
      # bindings have to agree on a byte layout; a gate that only ever executes
      # on a laptop is how they quietly stop agreeing.
      - name: Interop peer self-check (make test-interop-peer)
        run: uv run poe interop_peer

      - name: Assertion observation ordering (#lzassertordering)
        run: python3 ../lazily-spec/scripts/check-assertion-ordering.py --binding py --root .

      # The gate that keeps every step above honest (#lzcheckcireachguard). It
      # compares `make check`'s prerequisite closure against the run: bodies in
      # this file and fails on any target CI does not reach. Comments inside run:
      # bodies are stripped first — a naive grep for "make check" reported all
      # nine bindings as covered and every one of those hits was a comment.
      - name: CI-reachability guard (#lzcheckcireachguard)
        run: |
          out=$(./scripts/check-ci-reach.sh 2>&1) || { echo "$out"; echo "::error::a make check gate is unreachable from CI"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "check-ci-reach: OK" || {
            echo "::error::the CI-reachability guard exited 0 without reaching its verdict"
            exit 1
          }
