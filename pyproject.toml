[project]
name = "lazily"
version = "0.41.0"
description = "A library for lazy evaluation with context caching"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Brian Takita", email = "brian.takita@gmail.com" }
]
maintainers = [
    { name = "Brian Takita", email = "brian.takita@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
keywords = ["lazy", "evaluation", "dependency", "injection", "context", "lazily"]
requires-python = ">=3.12"
dependencies = [
    # mypy_extensions.mypyc_attr decorates the public reactive classes
    # (Slot/Source/Computed/Effect) with ``allow_interpreted_subclasses=True``.
    # mypyc processes it at compile time and bakes it into the C extension, so
    # compiled installs never import it at runtime; it is required by the
    # shipped pure-Python fallback (used when compilation is unavailable).
    "mypy-extensions>=1.0",
]

[project.urls]
"Homepage" = "https://github.com/lazily-hub/lazily-py"
"Bug Reports" = "https://github.com/lazily-hub/lazily-py/issues"
"Source" = "https://github.com/lazily-hub/lazily-py"

[project.optional-dependencies]
# Struct-bridge backends (``lazily.struct_cell`` / ``#lzpystructcell``). These
# are INSTALL ERGONOMICS, not dependencies: `struct_source` never imports any of
# them at module scope and never imports one to decide whether a type belongs to
# it (the backends probe structurally). The stdlib backends — dataclasses and
# NamedTuple — need no extra at all, which is also why this bridge is not a
# separate distribution: a standalone package would ship zero dependencies and
# pin a lazily version to reach Source/Computed/batch.
attrs = ["attrs>=23.1"]
msgspec = ["msgspec>=0.18"]
pydantic = ["pydantic>=2.0"]
# `prometheus_client` egress adapter (``lazily.prometheus_egress``). Same rule:
# `lazily.metrics` renders the text exposition format with no dependency at all,
# and the adapter imports prometheus_client lazily inside the calls that need it.
prometheus = ["prometheus-client>=0.20"]
structs = ["lazily[attrs,msgspec,pydantic]"]
dev = [
    "build==1.4.0",
    "jsonschema==4.23.0",
    "lazily[prometheus,structs]",
    "mypy[mypyc]>=2.3",
    "poethepoet==0.40.0",
    "pytest-cov==7.0.0",
    "pytest==9.0.2",
    "referencing==0.37.0",
    "ruff==0.14.14",
    "twine==6.2.0",
    "ty==0.0.14",
]

[dependency-groups]
dev = ["lazily[dev]"]

[build-system]
# setuptools + mypyc compile the reactive core (slot/cell/signal/effect/batch)
# to native C extension classes. setup.py falls back to a pure-Python build if
# mypyc or a C compiler is unavailable, so the package still installs without a
# toolchain (losing the speedup, keeping correctness). See setup.py + the
# "Compilation" note in BENCHMARKS.md.
requires = ["setuptools>=61", "wheel", "mypy[mypyc]>=2.3", "mypy-extensions>=1.0"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Supported CPython versions (requires-python = ">=3.12").
build = "cp312-* cp313-* cp314-*"
# pypa/build for build isolation (matches `make build`); isolation installs
# mypy[mypyc] from build-system.requires, so setup.py's mypycify runs per wheel.
build-frontend = "build"
# Smoke-test each built wheel: import the compiled core modules.
test-command = "python -c \"from lazily import slot, cell, signal, effect, batch; print('wheel ok')\""
# Skip the PyPy/free-threaded/etc. targets; mypyc targets CPython only.
skip = "pp* *-win32 *_i686"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv]
default-groups = ["dev"]
python-preference = "only-managed"
package = true

[tool.poe.tasks]
init = "uv sync --all-groups"

# The four conformance guards all run from here, because CI runs `poe precommit`
# and nothing else (#lzguardsnotinci). Rungs 2-4 (unconsumed key, unasserted key,
# unreplayed scenario) are wired into `tests/conftest.py:pytest_sessionfinish`, so
# `test` carries them. Rung 1 (the runtime fixture manifest / coverage guard) is a
# separate script and used to run only from `make check` on a developer's machine —
# a guard nobody's CI executes is a guard that does not exist. `conformance_manifest`
# truncates the manifest the recorder appends to and STAMPS it with the run id, so
# `conformance_coverage` — which reads it back out of a different process — can
# tell this invocation's evidence from an earlier run's (#lzstalemanifest).
# `interop_peer` joins the list for the same reason the coverage guard did
# (#lzinteroppeerci): `make check` ran the cross-binding wire-compatibility peer
# and no binding's CI ran it anywhere. Nine bindings have to agree on a byte
# layout, and a gate that only ever executes on a laptop is how they quietly
# stop agreeing.
interop_peer = "python -m lazily.interop_peer --self-check"
# The lint/format GATES (#lzruffautofixvacuity). Non-repairing on purpose: a
# linter that rewrites the tree it is judging exits 0 no matter what it found,
# so `precommit` used to self-heal to green instead of gating, and formatting
# was not checked at all. The repairing forms below are named `*_fix` and are
# deliberately NOT in `precommit` — running one is a decision, not a side
# effect.
ruff_check = "ruff check --no-fix"
ruff_format_check = "ruff format --check"
ruff_fix = "ruff check --fix"
ruff_format_fix = "ruff format"
run_readme = "python -m tests.run_readme"
ty = "ty check src"

# `precommit` is a sequence with a `uses`, not a bare array, for exactly one
# reason: the conformance run id (#lzstalemanifest).
#
# The id has to be generated ONCE per invocation and shared by the three steps
# that touch the split evidence file — `conformance_manifest` stamps it, `test`
# records under it, `conformance_coverage` demands it. poe resolves a `uses`
# dependency once and injects its stdout into the env of the task that declares
# it, and a sequence passes that env down to every subtask, so one `uses` here
# gives all three the same value. Per-subtask `uses` would give each a DIFFERENT
# id and fail closed on every run.
#
# `conformance_run_id` passes an inherited id through unchanged, so `make check`
# (which generates its own and exports it) keeps one id across the whole
# invocation even if a step reaches poe through this sequence.
[tool.poe.tasks.precommit]
uses = { LAZILY_CONFORMANCE_RUN_ID = "conformance_run_id" }
sequence = [
    "ty",
    "ruff_format_check",
    "ruff_check",
    "run_readme",
    "conformance_manifest",
    "test",
    "conformance_coverage",
    "interop_peer",
]

# Emit the id for THIS invocation, honouring one already in the environment.
# Not a guard and not evidence — just the generator, so that `poe precommit`
# stands on its own without `make`.
[tool.poe.tasks.conformance_run_id]
shell = '''
printf '%s\n' "${LAZILY_CONFORMANCE_RUN_ID:-poe-$(date -u +%Y%m%dT%H%M%S)-$$}"
'''

# Truncate before the run, and STAMP the run id as the first line
# (#lzstalemanifest). The recorder APPENDS (pytest-xdist and reruns each
# contribute reads), so a manifest left over from an earlier invocation would
# credit this run with fixtures it never opened — a stale green in the one file
# the coverage guard treats as evidence. Truncating closes that only while the
# three steps run IN ORDER inside one invocation; it does nothing for a guard
# invoked on its own afterwards, which is what the stamp is for. The guard reads
# line 1 and refuses any id that is not the current invocation's.
#
# Refusing an unset id here rather than inventing one is deliberate: this task is
# the thing that decides what the evidence CLAIMS, so a fallback id minted here
# would be a claim about a run nobody identified.
[tool.poe.tasks.conformance_manifest]
shell = '''
if [ -z "${LAZILY_CONFORMANCE_RUN_ID:-}" ]; then
  echo "FAIL: LAZILY_CONFORMANCE_RUN_ID is unset, so the fixture manifest cannot be" >&2
  echo "      stamped and the coverage guard has no way to tell this run's evidence" >&2
  echo "      from an earlier run's (#lzstalemanifest). Run this through 'make test'" >&2
  echo "      or 'poe precommit', both of which generate one." >&2
  exit 1
fi
mkdir -p build
printf '# lazily-run-id %s\n' "$LAZILY_CONFORMANCE_RUN_ID" > build/conformance-fixtures-loaded.txt
'''

[tool.poe.tasks.test]
cmd = "pytest tests/ -v"
# Set here rather than only in the Makefile so `poe test`, `make test` and CI all
# attach the recorder. Without it the suite still runs and still enforces rungs
# 2-4, but writes no manifest, and rung 1 has no evidence to read.
env = { LAZILY_CONFORMANCE_MANIFEST = "build/conformance-fixtures-loaded.txt" }

[tool.poe.tasks.conformance_coverage]
cmd = "./scripts/check-conformance-coverage.sh"
env = { LAZILY_CONFORMANCE_MANIFEST = "build/conformance-fixtures-loaded.txt" }

[tool.ruff]
target-version = "py312"

# Set the maximum line length to 88 (Black's default)
line-length = 88

# NO `fix = true` (#lzruffautofixvacuity). It made a bare `ruff check` repair
# the tree it was judging and exit 0, which turned every lint gate that did not
# remember `--no-fix` into a gate that cannot fail. Auto-fixing is available
# explicitly: `make lint-fix` / `poe ruff_fix`.

# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable these rule categories
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "C90", # McCabe complexity
    "T20", # flake8-print
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]

# Disable specific rules that might be too strict for your use case
ignore = [
    "E501", # Line too long (handled by line-length setting)
    "B008", # Do not perform function calls in argument defaults
    "C901", # Too complex (let McCabe complexity handle this)
    "T201", # Print found (useful for debugging)
    "ARG002", # Unused method argument (common in inheritance)
    "SIM108", # Use ternary operator (sometimes if/else is clearer)
]

# Allow unused variables when they start with an underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Tests can use assertions and have longer lines for readability
"tests/**/*" = [
    "S101", # Use of assert
    "ARG001", # Unused function argument
    "ARG005", # Unused lambda argument
    "SIM117", # Use a single with statement
]

# __init__.py files can have unused imports (for re-exporting)
"__init__.py" = [
    "F401", # Unused import
]

[tool.ruff.lint.isort]
# Configure import sorting to match your preferences
known-first-party = ["lazily"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
# Set the maximum complexity threshold
max-complexity = 10

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Use spaces around the equals sign in keyword arguments
indent-style = "space"

# Automatically format docstrings
docstring-code-format = true

# Use trailing commas
skip-magic-trailing-comma = false
