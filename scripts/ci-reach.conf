# CI-reachability configuration (#lzcheckcireachguard), read by check-ci-reach.sh.
#
# workflow:  a workflow whose run: steps count as CI reach. Listing one here is a
#            claim that it runs on every push/PR — a tag-triggered release
#            workflow must not be listed, because reaching a gate only when you
#            cut a release is not reaching it.
# excuse:    a `make check` target that CI deliberately does not run, and why.
#
# The excuse list is the point of this file. It is the one place a reader can see
# what this binding does not enforce in CI, in the same spirit as KNOWN_UNCOVERED.
# Excuses are verified in every direction they can rot, so this list cannot drift
# into things that used to be true:
#
#   * an excuse with no reason is refused when this file is parsed.
#   * an excuse for a target CI turns out to REACH is a hard failure — stale.
#   * an excuse for a target that is not in `make check`'s closure at all is a
#     hard failure too (#pinreachclosure). Until that check existed, an excuse is
#     only ever consulted while walking the closure, so one naming something
#     outside it was read by nobody and counted by nothing: `0 excused`, no
#     complaint, exit 0. Measured with two planted here — `bench-scale`, a real
#     target outside `check`, and a name matching no rule at all — and both
#     vanished without a word.
#
# WHICH targets `make check` must run is pinned separately, in
# EXPECTED_CLOSURE_TARGETS in check-ci-reach.sh, and WHICH CI STEP runs each of
# them in EXPECTED_GATE_STEPS beside it (#reversereachdirection). An excuse moves a target
# from "must be reached" to "deliberately not reached"; it is not a way to remove
# one from the pinned set, and it is the OPPOSITE claim to a gate-step pin — the
# guard refuses a target that carries both.
#
# WHETHER THAT WORKFLOW AND ITS JOB RUN AT ALL is pinned too, in
# EXPECTED_TRIGGERS, EXPECTED_TRIGGER_FILTERS, EXPECTED_GATE_JOBS and
# EXPECTED_GATE_JOB_GUARDS (#verifyworkflowactually). Until those existed, the
# paragraph below was a COMMENT — the one premise the whole audit rested on that
# nothing checked. Reducing `on:` to workflow_dispatch, or putting `if: false` on
# the job, left every verdict green while no gate ran on any push; both now exit
# 1 naming the changed value.
#
# This binding has no ci.yml, so the default does not apply and the workflows are
# named explicitly:
#
#   .github/workflows/precommit.yml   LISTED. It is the only workflow that gates
#                                     the library code, and it runs on
#                                     `push` (`branches: ["**"]`) and
#                                     `workflow_dispatch` — pinned exactly, so
#                                     this sentence cannot go stale in silence.
#
#                                     ON A PULL REQUEST, precisely. There is NO
#                                     `pull_request:` trigger here, and this is
#                                     the only counted workflow in the family
#                                     without one. A SAME-REPO PR is still gated:
#                                     the push to its head branch is itself a run,
#                                     and its checks are filed under the PR's head
#                                     sha — measured on all four merged PRs in
#                                     this repo, each carrying three green
#                                     `precommit (3.1x)` checks. A FORK PR is NOT:
#                                     its push happens in the fork, so nothing
#                                     runs here. Neither is the
#                                     `refs/pull/N/merge` commit `pull_request`
#                                     would test, so a PR green on its head and
#                                     broken against a moved base is caught only
#                                     once the merge reaches main.
#
#                                     Latent today — 0 forks, no branch
#                                     protection, every PR so far same-repo and
#                                     from the owner — and REPORTED rather than
#                                     fixed: changing `on:` is a behaviour change
#                                     and not the guard's to make. Adding
#                                     `pull_request:` reds check-ci-reach until
#                                     EXPECTED_TRIGGERS moves with it, which is
#                                     the reviewable form of that decision.
#
#   .github/workflows/wheels.yml      NOT LISTED. It triggers on `push: tags:
#                                     ["v*"]`, workflow_dispatch, and a
#                                     pull_request narrowed by `paths:` to the
#                                     packaging files (this workflow, pyproject
#                                     .toml, setup.py). A gate reached only when
#                                     someone cuts a release — or only when a PR
#                                     happens to touch setup.py — is not reached.
#                                     Listing it would let a packaging job launder
#                                     a `make check` gate into "covered" for the
#                                     ordinary pushes where it never runs. Its
#                                     `pull_request:` trigger has never fired in
#                                     12 runs, which is the shape of the problem:
#                                     a trigger narrowed by `paths:` is a trigger
#                                     most commits do not have.

workflow: .github/workflows/precommit.yml

# No excuses. Every gate `make check` runs is reached by the workflow above,
# which is a claim the guard re-proves on every run rather than a note.
